version: '3.8'

services:
  omr-exam-api:
    build: .
    container_name: omr-exam-system
    restart: unless-stopped
    ports:
      - "8801:8801"
    volumes:
      - ./data:/app/temp_storage
      - ./maps:/app/maps
      - ./uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8801 --reload